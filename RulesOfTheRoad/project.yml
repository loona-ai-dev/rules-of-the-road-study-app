name: RulesOfTheRoad
options:
  bundleIdPrefix: com.swsc
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"  # iPhone only
    SUPPORTS_MACCATALYST: "NO"
    ENABLE_PREVIEWS: "YES"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  RulesOfTheRoad:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    info:
      path: RulesOfTheRoad/Info.plist
      properties:
        CFBundleDisplayName: Rules of the Road
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiresFullScreen: true
        NSHumanReadableDescription: SWOS Advanced Shiphandling COLREGS exam preparation

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swsc.rulesoftheroad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: RulesOfTheRoad/Info.plist
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: T2L49AHSZ6
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule
          VALIDATE_PRODUCT: "YES"
          ENABLE_BITCODE: "NO"

    sources:
      - path: RulesOfTheRoad
        excludes:
          - "Info.plist"
        createIntermediateGroups: true

    resources:
      - path: RulesOfTheRoad/Assets.xcassets
      - path: RulesOfTheRoad/questions.json
      - path: RulesOfTheRoad/rules.json

schemes:
  RulesOfTheRoad:
    build:
      targets:
        RulesOfTheRoad: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
